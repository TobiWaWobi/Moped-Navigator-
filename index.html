<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
      content="#111827">

<title>Moped-Navigator</title>

<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family: Arial, sans-serif;

    background: #111827;

    color: white;
}

.app {

    max-width: 600px;

    margin: auto;

    min-height: 100vh;

    background: #181818;
}

header {

    padding: 20px;

    text-align: center;

    background: #222;
}

header h1 {

    margin: 0;

    font-size: 26px;
}

header p {

    margin: 6px 0 0;

    color: #aaa;
}


/* =========================
   KARTE
   ========================= */

#map {

    height: 400px;

    margin: 15px;

    border-radius: 18px;

    overflow: hidden;
}


/* =========================
   GPS STATUS
   ========================= */

.gps-status {

    text-align: center;

    padding: 5px 15px 15px;

    color: #aaa;
}


/* =========================
   STATISTIK
   ========================= */

.stats {

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 12px;

    padding: 15px;
}

.stat {

    background: #252525;

    padding: 18px;

    border-radius: 15px;

    text-align: center;
}

.stat-title {

    color: #999;

    font-size: 14px;
}

.stat-value {

    font-size: 26px;

    font-weight: bold;

    margin-top: 8px;
}


/* =========================
   START BUTTON
   ========================= */

.start-button {

    display: block;

    width: calc(100% - 30px);

    margin: 10px 15px 30px;

    padding: 18px;

    border: none;

    border-radius: 15px;

    background: #2563eb;

    color: white;

    font-size: 18px;

    font-weight: bold;

    cursor: pointer;
}


/* =========================
   MOPED BEREICH
   ========================= */

#moped-section {

    padding: 20px;

    background: #202020;
}

#moped-section h2 {

    text-align: center;
}

#moped-section input {

    display: block;

    width: 100%;

    margin: 8px 0;

    padding: 13px;

    border: none;

    border-radius: 10px;

    font-size: 16px;
}

#moped-section button {

    width: 100%;

    margin-top: 8px;

    padding: 13px;

    border: none;

    border-radius: 10px;

    background: #2563eb;

    color: white;

    font-size: 16px;

    font-weight: bold;
}

#mopedList {

    margin-top: 20px;
}

.moped-card {

    background: #303030;

    padding: 15px;

    margin-top: 10px;

    border-radius: 12px;
}

.moped-card h3 {

    margin-top: 0;
}


/* =========================
   INFO
   ========================= */

.info {

    text-align: center;

    padding: 25px;

    color: #777;

    font-size: 13px;
}

</style>

</head>


<body>


<div class="app">


<header>

    <h1>🏍️ Moped-Navigator</h1>

    <p>
        Dein Begleiter auf jeder Fahrt
    </p>

</header>


<!-- =========================
     KARTE
     ========================= -->

<div id="map"></div>


<div
    class="gps-status"
    id="gpsStatus"
>

    📍 GPS noch nicht gestartet

</div>


<!-- =========================
     FAHRDATEN
     ========================= -->

<div class="stats">


    <div class="stat">

        <div class="stat-title">

            Geschwindigkeit

        </div>

        <div
            class="stat-value"
            id="speed"
        >

            0 km/h

        </div>

    </div>


    <div class="stat">

        <div class="stat-title">

            Strecke

        </div>

        <div
            class="stat-value"
            id="distance"
        >

            0,00 km

        </div>

    </div>


    <div class="stat">

        <div class="stat-title">

            Fahrzeit

        </div>

        <div
            class="stat-value"
            id="time"
        >

            00:00

        </div>

    </div>


    <div class="stat">

        <div class="stat-title">

            Höhe

        </div>

        <div
            class="stat-value"
            id="altitude"
        >

            -- m

        </div>

    </div>


</div>


<!-- =========================
     FAHRT BUTTON
     ========================= -->

<button
    class="start-button"
    id="startButton"
    onclick="toggleRide()"
>

    🏁 FAHRT STARTEN

</button>


<!-- =========================
     MOPEDS
     ========================= -->

<div id="moped-section">

    <h2>🛵 Meine Mopeds</h2>


    <input
        id="mopedName"
        type="text"
        placeholder="Name, z. B. Mein Moped"
    >


    <input
        id="mopedModel"
        type="text"
        placeholder="Modell"
    >


    <input
        id="tankSize"
        type="number"
        step="0.1"
        placeholder="Tankgröße (Liter)"
    >


    <input
        id="consumption"
        type="number"
        step="0.1"
        placeholder="Verbrauch (L/100 km)"
    >


    <input
        id="currentFuel"
        type="number"
        step="0.1"
        placeholder="Aktueller Tankinhalt (Liter)"
    >


    <button onclick="saveNewMoped()">

        🛵 Moped hinzufügen

    </button>


    <div id="mopedList"></div>

</div>


<div class="info">

    Moped-Navigator – Version 0.3

</div>


</div>


<!-- =========================
     LEAFLET
     ========================= -->

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>


<script>


/* =========================
   VARIABLEN
   ========================= */

let map;

let userMarker;

let routeLine;

let watchId = null;

let running = false;

let startTime = null;

let timer = null;

let totalDistance = 0;

let lastPosition = null;

let routeCoordinates = [];


/* =========================
   KARTE ERSTELLEN
   ========================= */

map = L.map("map").setView(
    [51.1657, 10.4515],
    6
);


L.tileLayer(

    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

    {

        attribution:
            "&copy; OpenStreetMap-Mitwirkende"

    }

).addTo(map);


/* =========================
   ROUTE
   ========================= */

routeLine = L.polyline(

    [],

    {

        color: "#2563eb",

        weight: 5

    }

).addTo(map);


/* =========================
   START / STOP
   ========================= */

function toggleRide() {

    if (running) {

        stopRide();

    } else {

        startRide();

    }

}


/* =========================
   FAHRT STARTEN
   ========================= */

function startRide() {

    if (!navigator.geolocation) {

        document.getElementById(
            "gpsStatus"
        ).innerText =
            "❌ GPS wird nicht unterstützt.";

        return;

    }


    running = true;

    totalDistance = 0;

    lastPosition = null;

    routeCoordinates = [];


    routeLine.setLatLngs([]);


    startTime = Date.now();


    document.getElementById(
        "distance"
    ).innerText =
        "0,00 km";


    document.getElementById(
        "speed"
    ).innerText =
        "0 km/h";


    document.getElementById(
        "startButton"
    ).innerText =
        "🛑 FAHRT BEENDEN";


    document.getElementById(
        "gpsStatus"
    ).innerText =
        "📍 GPS wird gesucht...";


    timer = setInterval(
        updateTime,
        1000
    );


    watchId =
        navigator.geolocation.watchPosition(

            updateGPS,

            gpsError,

            {

                enableHighAccuracy: true,

                maximumAge: 1000,

                timeout: 10000

            }

        );

}


/* =========================
   FAHRT BEENDEN
   ========================= */

function stopRide() {

    running = false;


    if (watchId !== null) {

        navigator.geolocation.clearWatch(
            watchId
        );

        watchId = null;

    }


    if (timer !== null) {

        clearInterval(timer);

        timer = null;

    }


    document.getElementById(
        "startButton"
    ).innerText =
        "🏁 FAHRT STARTEN";


    document.getElementById(
        "gpsStatus"
    ).innerText =
        "⏹️ Fahrt beendet";

}


/* =========================
   GPS
   ========================= */

function updateGPS(position) {


    const latitude =
        position.coords.latitude;


    const longitude =
        position.coords.longitude;


    const accuracy =
        position.coords.accuracy;


    const speedGPS =
        position.coords.speed;


    const altitude =
        position.coords.altitude;


    const current = {

        lat: latitude,

        lng: longitude

    };


    /* =========================
       GESCHWINDIGKEIT
       ========================= */

    let speed = 0;


    if (
        speedGPS !== null &&
        speedGPS >= 0
    ) {

        speed =
            speedGPS * 3.6;


        if (speed < 2) {

            speed = 0;

        }

    }


    document.getElementById(
        "speed"
    ).innerText =
        Math.round(speed)
        + " km/h";


    /* =========================
       HÖHE
       ========================= */

    if (altitude !== null) {

        document.getElementById(
            "altitude"
        ).innerText =
            Math.round(altitude)
            + " m";

    }


    /* =========================
       MARKER
       ========================= */

    if (!userMarker) {


        userMarker = L.marker(

            [
                latitude,
                longitude
            ]

        )

        .addTo(map)

        .bindPopup(
            "📍 Deine Position"
        );


        map.setView(

            [
                latitude,
                longitude
            ],

            17

        );


    } else {


        userMarker.setLatLng(

            [
                latitude,
                longitude
            ]

        );


        map.panTo(

            [
                latitude,
                longitude
            ]

        );

    }


    /* =========================
       STRECKE
       ========================= */

    if (lastPosition) {


        const distance =
            map.distance(

                [
                    lastPosition.lat,
                    lastPosition.lng
                ],

                [
                    current.lat,
                    current.lng
                ]

            );


        /*
        GPS-Ungenauigkeit
        herausfiltern
        */

        if (

            accuracy <= 30 &&

            distance >= 3 &&

            distance < 500

        ) {

            totalDistance +=
                distance;

        }

    }


    lastPosition =
        current;


    document.getElementById(
        "distance"
    ).innerText =

        (
            totalDistance / 1000
        )

        .toFixed(2)

        .replace(
            ".",
            ","
        )

        + " km";


    /* =========================
       ROUTE
       ========================= */

    routeCoordinates.push(

        [
            latitude,
            longitude
        ]

    );


    routeLine.setLatLngs(
        routeCoordinates
    );


    /* =========================
       GPS STATUS
       ========================= */

    document.getElementById(
        "gpsStatus"
    ).innerText =

        "📍 GPS aktiv • Genauigkeit ca. "

        + Math.round(accuracy)

        + " m";

}


/* =========================
   GPS FEHLER
   ========================= */

function gpsError(error) {


    let message =
        "❌ GPS konnte nicht verwendet werden.";


    if (error.code === 1) {

        message =
            "❌ Standortzugriff wurde verweigert.";

    }


    if (error.code === 2) {

        message =
            "❌ Standort konnte nicht gefunden werden.";

    }


    if (error.code === 3) {

        message =
            "❌ GPS-Zeitüberschreitung.";

    }


    document.getElementById(
        "gpsStatus"
    ).innerText =
        message;

}


/* =========================
   FAHRZEIT
   ========================= */

function updateTime() {


    if (!running) {

        return;

    }


    const elapsed =

        Math.floor(

            (
                Date.now()
                - startTime
            ) / 1000

        );


    const minutes =
        Math.floor(
            elapsed / 60
        );


    const seconds =
        elapsed % 60;


    document.getElementById(
        "time"
    ).innerText =

        String(minutes)
            .padStart(2, "0")

        + ":"

        + String(seconds)
            .padStart(2, "0");

}


</script>


<!-- =========================
     MOPED-DATEN
     ========================= -->

<script src="mopeds.js"></script>


<script>


function saveNewMoped() {


    const name =
        document.getElementById(
            "mopedName"
        ).value;


    const model =
        document.getElementById(
            "mopedModel"
        ).value;


    const tankSize =
        document.getElementById(
            "tankSize"
        ).value;


    const consumption =
        document.getElementById(
            "consumption"
        ).value;


    const currentFuel =
        document.getElementById(
            "currentFuel"
        ).value;


    if (

        !name ||
        !model ||
        !tankSize ||
        !consumption ||
        !currentFuel

    ) {

        alert(
            "Bitte alle Felder ausfüllen."
        );

        return;

    }


    addMoped(

        name,
        model,
        tankSize,
        consumption,
        currentFuel

    );


    document.getElementById(
        "mopedName"
    ).value = "";


    document.getElementById(
        "mopedModel"
    ).value = "";


    document.getElementById(
        "tankSize"
    ).value = "";


    document.getElementById(
        "consumption"
    ).value = "";


    document.getElementById(
        "currentFuel"
    ).value = "";


    showMopeds();

}


/* =========================
   MOPEDS ANZEIGEN
   ========================= */

function showMopeds() {


    const list =
        document.getElementById(
            "mopedList"
        );


    const mopeds =
        getMopeds();


    list.innerHTML = "";


    mopeds.forEach(

        function(moped) {


            const range =
                calculateRange(
                    moped
                );


            list.innerHTML += `

                <div class="moped-card">

                    <h3>
                        🛵 ${moped.name}
                    </h3>

                    <p>
                        Modell:
                        ${moped.model}
                    </p>

                    <p>
                        Reichweite:
                        ${range.toFixed(0)}
                        km
                    </p>

                    <button
                        onclick="removeMoped(${moped.id})"
                    >

                        🗑️ Löschen

                    </button>

                </div>

            `;

        }

    );

}


/* =========================
   MOPED LÖSCHEN
   ========================= */

function removeMoped(id) {

    deleteMoped(id);

    showMopeds();

}


/* =========================
   MOPEDS LADEN
   ========================= */

showMopeds();


</script>


</body>

</html>
